<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" href="./favicon.svg" />
    <title>Шаурма-лавка</title>
  </head>
  <body>
    <div id="app">
      <header id="hud">
        <div class="hud-top">
          <span id="place" class="place"></span>
          <button id="sound" class="icon-btn" type="button"></button>
        </div>
        <div id="money" class="money">0 ₽</div>
        <div id="rate" class="rate"></div>
        <button id="boost" class="boost" type="button"><span class="boost-ad">▶</span><span id="boost-label"></span></button>
      </header>

      <main id="stage">
        <div id="hint" class="hint"></div>
      </main>

      <section id="panel">
        <nav class="tabs" role="tablist">
          <button id="tab-upgrades" role="tab" type="button"></button>
          <button id="tab-move" role="tab" type="button"></button>
          <button id="tab-shop" role="tab" type="button"></button>
        </nav>
        <div id="panel-upgrades" class="panel-body"><div id="upgrades" class="list"></div></div>
        <div id="panel-move" class="panel-body" hidden>
          <div class="move">
            <div class="move-now"><b id="move-now"></b><span id="move-mult" class="pill"></span></div>
            <div id="move-next" class="card">
              <b id="move-next-name"></b>
              <span id="move-need" class="muted"></span>
              <div class="bar"><div id="move-bar"></div></div>
              <span id="move-progress" class="muted"></span>
              <p id="move-warn"></p>
              <button id="move-btn" class="primary" type="button"></button>
            </div>
            <p id="move-done" class="card" hidden></p>
          </div>
        </div>
        <div id="panel-shop" class="panel-body" hidden><div id="shop" class="list"></div></div>
      </section>

      <div id="toast" class="toast" hidden></div>
      <div id="offline" class="modal" hidden>
        <div class="modal-card">
          <h2 id="offline-title"></h2>
          <p id="offline-text"></p>
          <div class="modal-btns">
            <button id="offline-double" class="primary" type="button"></button>
            <button id="offline-take" class="secondary" type="button"></button>
          </div>
        </div>
      </div>
      <div id="loading" class="loading">🌯</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
