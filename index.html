<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" href="./favicon.svg" />
    <title>Шаурма-лавка</title>
  </head>
  <body>
    <div id="app">
      <main id="stage">
        <header id="hud">
          <div class="hud-top">
            <span id="place" class="place"></span>
            <span class="hud-btns">
              <button id="music" class="icon-btn" type="button"></button>
              <button id="sound" class="icon-btn" type="button"></button>
            </span>
          </div>
          <div id="money" class="money">0 ₽</div>
          <div class="rate"><span id="rate-sec"></span><span id="rate-tap"></span></div>
          <button id="boost" class="boost" type="button"><span class="boost-ad" aria-hidden="true">▶</span><span id="boost-label"></span></button>
        </header>
        <div id="rush" class="rush" hidden><b id="rush-title"></b><span id="rush-text"></span></div>
        <div id="hint" class="hint"></div>
        <div id="toast" class="toast" hidden></div>
      </main>

      <section id="panel">
        <nav class="tabs" role="tablist">
          <button id="tab-upgrades" role="tab" type="button"></button>
          <button id="tab-move" role="tab" type="button"></button>
          <button id="tab-awards" role="tab" type="button"></button>
          <button id="tab-shop" role="tab" type="button"></button>
        </nav>
        <div id="panel-upgrades" class="panel-body">
          <div id="buy-mode" class="buy-mode" role="radiogroup">
            <button type="button" data-mode="x1"></button><button type="button" data-mode="x10"></button><button type="button" data-mode="max"></button>
          </div>
          <div id="upgrades" class="menu"></div>
        </div>
        <div id="panel-move" class="panel-body" hidden>
          <div class="move">
            <div class="move-now"><b id="move-now"></b><span id="move-mult" class="stamp-pill"></span></div>
            <div id="move-next" class="ticket">
              <b id="move-next-name" class="ticket-title"></b>
              <span id="move-next-desc" class="ticket-desc"></span>
              <span id="move-need" class="muted"></span>
              <div class="bar"><div id="move-bar"></div></div>
              <span id="move-progress" class="muted"></span>
              <p id="move-warn"></p>
              <button id="move-btn" class="primary" type="button"></button>
            </div>
            <p id="move-done" class="ticket" hidden></p>
          </div>
        </div>
        <div id="panel-awards" class="panel-body" hidden>
          <div class="section-head"><h3 id="coll-title"></h3><span id="coll-count" class="stamp-pill"></span></div>
          <p id="coll-note" class="awards-note"></p>
          <div id="collection" class="collection"></div>
          <div class="section-head"><h3 id="ach-title"></h3><span id="ach-count" class="stamp-pill"></span></div>
          <p id="awards-note" class="awards-note"></p>
          <div id="awards" class="awards"></div>
        </div>
        <div id="panel-shop" class="panel-body" hidden><div id="shop" class="coupons"></div></div>
      </section>

      <div id="offline" class="modal" hidden>
        <div class="receipt">
          <h2 id="offline-title"></h2>
          <div class="receipt-lines">
            <div><span id="offline-time-label"></span><span id="offline-time"></span></div>
            <div><span id="offline-rate-label"></span><span id="offline-rate"></span></div>
          </div>
          <div class="receipt-total"><span id="offline-total-label"></span><b id="offline-text"></b></div>
          <div class="modal-btns">
            <button id="offline-double" class="primary" type="button"></button>
            <button id="offline-take" class="secondary" type="button"></button>
          </div>
        </div>
      </div>
      <div id="move-card" class="move-card" hidden>
        <div class="move-card-in">
          <span id="move-card-kicker" class="move-card-kicker"></span>
          <b id="move-card-name"></b>
          <span id="move-card-desc"></span>
          <span id="move-card-mult" class="stamp-pill"></span>
        </div>
      </div>
      <div id="loading" class="loading">
        <div class="loading-spit" aria-hidden="true"><i></i></div>
        <span>Шаурма-лавка</span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
