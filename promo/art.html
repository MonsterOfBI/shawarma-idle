<!doctype html>
<!-- Источник старой иконки и обложки (иконка теперь рисуется в icon-lab.html, см. src/iconlab.ts). Фон — кадр самой игры (scene-*.png), сверху название.
     Пересобрать: открыть с ?icon или ?cover и сделать скриншот 512×512 или 800×470. -->
<meta charset="utf-8">
<style>
  @font-face { font-family: U; font-weight: 900; src: url(../node_modules/@fontsource/unbounded/files/unbounded-cyrillic-900-normal.woff2) format('woff2'); unicode-range: U+0400-04FF; }
  @font-face { font-family: U; font-weight: 900; src: url(../node_modules/@fontsource/unbounded/files/unbounded-latin-900-normal.woff2) format('woff2'); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2a1b3d; font-family: U, system-ui, sans-serif; }
  .bg { position: absolute; inset: 0; background-repeat: no-repeat; }
  .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(42, 27, 61, .85) 0%, rgba(42, 27, 61, .45) 38%, transparent 60%); }
  h1 { position: absolute; left: 4.5%; top: 12%; margin: 0; max-width: 46%; color: #fff4dc; font-weight: 900; font-size: 7.6vw; line-height: 1; letter-spacing: -.02em;
    text-shadow: 0 .5vw 0 #2a1b3d; transform: rotate(-4deg); }
  h1 span { display: block; color: #ffb02e; }
  p { position: absolute; left: 5%; top: 50%; margin: 0; max-width: 34%; color: #fff4dc; font-weight: 900; font-size: 2.4vw; line-height: 1.25;
    background: #e4472b; padding: .8vw 1.2vw; border-radius: 1vw; transform: rotate(-3deg); box-shadow: 0 .5vw 0 #2a1b3d; }
</style>
<div class="bg" id="bg"></div>
<div class="shade" id="shade"></div>
<h1 id="t">Шаурма-<span>лавка</span></h1>
<p id="s">Итальянские брейнроты хотят шаурму!</p>
<script>
  const icon = location.search.includes('icon');
  const bg = document.getElementById('bg');
  if (icon) {
    ['t', 's', 'shade'].forEach((id) => document.getElementById(id).remove());
    bg.style.backgroundImage = 'url(scene-icon.png)';
    bg.style.backgroundSize = '165%';
    bg.style.backgroundPosition = '62% 72%';
  } else {
    bg.style.backgroundImage = 'url(scene-cover.png)';
    bg.style.backgroundSize = '118%';
    bg.style.backgroundPosition = '78% 70%';
  }
</script>
