<!doctype html>
<!-- Источник иконки и обложки. Пересобрать: открыть в браузере с ?icon или ?cover и сделать скриншот нужного размера. -->
<meta charset="utf-8">
<style>
  @font-face { font-family: U; font-weight: 900; src: url(../node_modules/@fontsource/unbounded/files/unbounded-cyrillic-900-normal.woff2) format('woff2'); unicode-range: U+0400-04FF; }
  @font-face { font-family: U; font-weight: 900; src: url(../node_modules/@fontsource/unbounded/files/unbounded-latin-900-normal.woff2) format('woff2'); }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: linear-gradient(180deg, #2a1b3d 0%, #6a3a78 45%, #e0705a 72%, #ffb070 82%); font-family: U, system-ui, sans-serif; }
  .scene { position: relative; width: 100vw; height: 100vh; }
  .moon { position: absolute; right: 12%; top: 14%; width: 7vw; aspect-ratio: 1; border-radius: 50%; box-shadow: 1.4vw 0.6vw 0 0 #f3f0ff; transform: translateX(-1.4vw); }
  .star { position: absolute; width: .5vw; aspect-ratio: 1; border-radius: 50%; background: #fff; opacity: .8; }
  .city { position: absolute; left: 0; right: 0; bottom: 22%; height: 40%; display: flex; align-items: flex-end; gap: .6vw; }
  .city i { flex: 1; background: #2a2148; position: relative;
    background-image: linear-gradient(90deg, transparent 30%, #2a2148 30% 70%, transparent 70%), linear-gradient(180deg, rgba(255, 200, 97, .8) 40%, transparent 40%); background-size: 3vw 3.6vw; background-position: 1vw 1.4vw; }
  .road { position: absolute; left: 0; right: 0; bottom: 14%; height: 8%; background: #24203a; }
  .ground { position: absolute; left: 0; right: 0; bottom: 0; height: 14%; background: #4a3f63; }
  .stall { position: absolute; bottom: 14%; left: 50%; transform: translateX(-50%); width: var(--w); height: calc(var(--w) * .62); }
  .body { position: absolute; inset: 0; background: #e4472b; box-shadow: 0 2vw 4vw rgba(255, 150, 60, .35); }
  .lower { position: absolute; left: 0; right: 0; bottom: 0; height: 28%; background: #b8371f; }
  .win { position: absolute; left: 8%; top: 18%; width: 56%; height: 48%; background: #3b2a4f; overflow: hidden; }
  .win::after { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 30% 60%, rgba(255, 140, 50, .7), transparent 60%); }
  .cone { position: absolute; left: 22%; top: 14%; width: 22%; height: 72%; background: repeating-linear-gradient(180deg, #b5651d 0 14%, #7f3f12 14% 18%); clip-path: polygon(0 0, 100% 0, 78% 100%, 22% 100%); z-index: 1; }
  .counter { position: absolute; left: -4%; right: -4%; top: 66%; height: 5%; background: #fff4dc; }
  .menu { position: absolute; right: 7%; top: 20%; width: 24%; height: 42%; background: #2f3a2f; border: .5vw solid #8a6a3a;
    background-image: repeating-linear-gradient(180deg, transparent 0 18%, rgba(232, 239, 224, .8) 18% 22%); background-size: 70% 100%; background-repeat: no-repeat; background-position: 30% 30%; }
  .awning { position: absolute; left: -7%; right: -7%; top: -18%; height: 18%; display: flex; }
  .awning i { flex: 1; background: #fffaf0; border-radius: 0 0 50% 50% / 0 0 40% 40%; }
  .awning i:nth-child(even) { background: #ffb02e; }
  .bulbs { position: absolute; left: -6%; right: -6%; top: 2%; display: flex; justify-content: space-between; }
  .bulbs b { width: 1.2vw; aspect-ratio: 1; border-radius: 50%; background: #ffd86b; box-shadow: 0 0 1.2vw #ffb02e; }
  .bulbs b:nth-child(3n) { background: #7ff0d0; box-shadow: 0 0 1.2vw #7ff0d0; }
  .sign { position: absolute; left: 50%; top: -42%; transform: translateX(-50%); width: 84%; height: 20%; background: #2a1b3d; border: .5vw solid #4a3560;
    display: flex; align-items: center; justify-content: center; color: #ffd86b; font-weight: 900; font-size: calc(var(--w) * .1);
    text-shadow: 0 0 .8vw #ff9d2e, 0 0 2vw #ff9d2e; }
  h1 { position: absolute; left: 4%; top: 8%; margin: 0; max-width: 46%; color: #fff4dc; font-weight: 900; font-size: 7.4vw; line-height: 1; letter-spacing: -.02em;
    text-shadow: 0 .5vw 0 #2a1b3d; transform: rotate(-4deg); }
  h1 span { display: block; color: #ffb02e; }
  .coin { position: absolute; width: 4.5vw; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #ffe89a, #ffcf3f 55%, #c98a12); }
</style>
<div class="scene">
  <div class="star" style="left:20%;top:10%"></div><div class="star" style="left:46%;top:6%"></div><div class="star" style="left:70%;top:18%"></div><div class="star" style="left:8%;top:30%"></div><div class="star" style="left:58%;top:28%"></div>
  <div class="moon"></div>
  <div class="city"><i style="height:62%"></i><i style="height:88%"></i><i style="height:50%"></i><i style="height:76%"></i><i style="height:96%"></i><i style="height:58%"></i><i style="height:80%"></i><i style="height:66%"></i></div>
  <div class="road"></div>
  <div class="ground"></div>
  <h1 id="t">Шаурма-<span>лавка</span></h1>
  <div class="stall">
    <div class="body"></div><div class="lower"></div>
    <div class="win"><div class="cone"></div></div>
    <div class="menu"></div>
    <div class="counter"></div>
    <div class="awning"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="bulbs"><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b></div>
    <div class="sign">ШАУРМА</div>
  </div>
  <div class="coin" style="left:20%;bottom:40%"></div><div class="coin" style="left:30%;bottom:52%;transform:scale(.7)"></div><div class="coin" style="right:6%;bottom:48%;transform:scale(.8)"></div>
</div>
<script>
  const icon = location.search.includes('icon');
  const stall = document.querySelector('.stall');
  document.documentElement.style.setProperty('--w', icon ? '64vw' : '38vw');
  if (icon) {
    document.getElementById('t').remove();
    document.querySelectorAll('.coin').forEach((c) => c.remove());
    stall.style.bottom = '18%';
  } else {
    stall.style.left = '68%';
  }
</script>
